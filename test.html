<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>XXX YYY - Petroleum Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Global styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f4f4f4;
        }
        h1, h2, h3 {
            font-family: 'Oswald', sans-serif;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #003366;
            padding: 15px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .navbar a {
            color: #fff;
            margin-right: 20px;
            font-size: 18px;
        }
        .navbar a:hover {
            color: #ffcc00;
        }
        .hamburger {
            display: none;
            cursor: pointer;
        }
        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
        }
        .nav-links {
            display: flex;
        }
        .nav-links.active {
            display: block;
        }

        /* Hero Section */
        .hero {
            background-image: url('https://via.placeholder.com/1500x800.png?text=Petroleum+Energy');
            background-size: cover;
            background-position: center;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 24px;
            margin-bottom: 40px;
        }
        .btn {
            padding: 15px 30px;
            background-color: #ffcc00;
            color: #003366;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #e6b800;
        }

        /* Page Content */
        .page {
            display: none;
            padding: 40px;
            background-color: #fff;
            margin-top: 60px;
        }
        .page.active {
            display: block;
        }

        /* Products Section */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-item {
            background-color: #003366;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .product-item:hover {
            transform: translateY(-10px);
        }
        .product-item img {
            max-width: 100%;
            border-radius: 8px;
        }

        /* Contact Section */
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <a href="#" id="logo">XXX YYY</a>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero" id="home">
        <h1>Welcome to XXX YYY Petroleum Solutions</h1>
        <p>Innovating Energy for a Sustainable Future</p>
        <button class="btn">Learn More</button>
    </div>

    <!-- Products Page -->
    <div class="page" id="products">
        <h2>Our Products</h2>
        <div class="products">
            <div class="product-item">
                <img src="https://via.placeholder.com/300x200.png?text=Product+1" alt="Product 1">
                <h3>Petroleum Product 1</h3>
                <p>High-quality fuel for your needs.</p>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/300x200.png?text=Product+2" alt="Product 2">
                <h3>Petroleum Product 2</h3>
                <p>Efficient and eco-friendly energy solutions.</p>
            </div>
        </div>
    </div>

    <!-- Contact Page -->
    <div class="page" id="contact">
        <h2>Contact Us</h2>
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="4" required></textarea>
            <button class="btn" type="submit">Send Message</button>
        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>
